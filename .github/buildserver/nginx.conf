server {
    listen 80;
    listen [::]:80;
    server_name build.torchapi.com;
    root /var/www/torchbuild;
    error_log /var/log/nginx/torchbuild_error.log;
    access_log /var/log/nginx/torchbuild_access.log;

    location ~ /\. {
        return 404;
    }

    location ~ ^/job/Torch/job/[A-Za-z0-9._-]+/(\d+/)?api/json$ {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/job/Torch/job/[A-Za-z0-9._-]+/\d+/artifact/bin/torch-server\.zip$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
